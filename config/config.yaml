samples: "config/samples.tsv"

directories:
  raw: "data/raw"
  trimmed: "data/trimmed"
  results: "results"
  logs: "logs"

reference:
  genome: "reference/GRCh38.primary_assembly.genome.fa"
  transcriptome: "reference/gencode.v50.transcripts.fa"
  annotation: "reference/gencode.v50.primary_assembly.annotation.gtf"

indexes:
  hisat2: "reference/index/grch38"
  kallisto: "reference/index/gencode.v50.transcripts.idx"

fastp:
  quality: 20
  window_size: 4

threads:
  fastqc: 2
  fastp: 4
  hisat2_index: 4
  hisat2_align: 4
  featurecounts: 4
  kallisto_index: 2
  kallisto_quant: 4

featurecounts:
  feature_type: "exon"
  attribute: "gene_id"
  strandedness: 0
