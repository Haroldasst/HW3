samples: "config/samples.tsv"

directories:
  raw: "data/raw"
  trimmed: "data/trimmed"
  results: "results"
  logs: "logs"

reference:
  genome: "reference/GRCh38.primary_assembly.genome.fa"
  transcriptome: "reference/gencode.v50.transcripts.fa"
  annotation: "reference/gencode.v50.primary_assembly.annotation.gtf"

indexes:
  hisat2: "reference/index/grch38"
  kallisto: "reference/index/gencode.v50.transcripts.idx"

fastp:
  quality: 20
  window_size: 4

threads:
  fastqc: 2
  fastp: 4
  hisat2_index: 4
  hisat2_align: 4
  featurecounts: 4
  kallisto_index: 2
  kallisto_quant: 4
  rseqc: 4
  deeptools: 4

featurecounts:
  feature_type: "exon"
  attribute: "gene_id"
  strandedness: 0

quality:
  bed12: "reference/index/gencode.v50.annotation.bed12"
  rseqc_dir: "results/quality/rseqc"
  deeptools_dir: "results/quality/deeptools"
  bin_size: 10000
  bigwig_bin_size: 50
  bigwig_normalization: "CPM"
  bed12_subset: "reference/index/gencode.v50.annotation.subset10k.bed12"
  gene_body_subset_size: 10000
  gene_body_subset_seed: 42
  inner_distance_sample_size: 1000000
  inner_distance_upper_bound: 1000
  inner_distance_lower_bound: -250
  inner_distance_step: 10
  inner_distance_mapq: 30
